[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "converge"
version = "0.1.0"
description = "CONVERGE: Validation-Guided Generative AI for Traditional Big Data Pipelines -- a research prototype integrating a language model into a Spark data-cleaning pipeline under an explicit validation boundary."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.1",
    "pydantic==2.13.4",
    "google-genai==2.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]

[project.scripts]
converge = "converge.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
